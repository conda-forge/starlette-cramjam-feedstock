schema_version: 1

context:
  version: "0.8.0"
  python_min: "3.11"

package:
  name: starlette-cramjam
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/starlette-cramjam/starlette_cramjam-${{ version }}.tar.gz
  sha256: e853ed4c9d581fdc95d20a94f9e73bc815dc933d7d54d5afc57f3662bab676a1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - starlette
    - cramjam >=2.4,<2.12

tests:
  - python:
      python_version: ${{ python_min }}.*
      imports:
        - starlette_cramjam
      pip_check: true

about:
  summary: Cramjam integration for Starlette ASGI framework.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/starlette-cramjam/
  repository: https://github.com/developmentseed/starlette-cramjam

extra:
  recipe-maintainers:
    - martinRenou
